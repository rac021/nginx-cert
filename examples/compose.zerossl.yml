# ZeroSSL -- unlimited 90-day certificates, wildcards supported.
#
# ZeroSSL's ACME endpoint requires External Account Binding. You have two ways
# to provide it, and nginx-cert accepts either:
#
#   A. an API key  -> nginx-cert calls ZeroSSL once to derive the EAB and
#                     caches it in /data/state/zerossl-eab.env (recommended,
#                     one variable to manage);
#   B. EAB credentials generated by hand in the ZeroSSL dashboard
#      (Developer -> EAB Credentials).
#
#   export ZEROSSL_API_KEY=...
#   docker compose -f examples/compose.zerossl.yml up -d

services:
  nginx-cert:
    image: rac021/nginx-cert:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CERT_PROVIDER: zerossl
      CERT_EMAIL: you@example.com
      CERT_DOMAINS: example.com, www.example.com
      CERT_UPSTREAM: app:8080

      # -- Option A: API key, EAB derived automatically ------------------
      CERT_ZEROSSL_API_KEY: ${ZEROSSL_API_KEY:?ZEROSSL_API_KEY is required}

      # -- Option B: explicit EAB credentials ----------------------------
      # CERT_EAB_KID: ${ZEROSSL_EAB_KID}
      # CERT_EAB_HMAC_KEY: ${ZEROSSL_EAB_HMAC}
    volumes:
      - nginx-cert-data:/data

  app:
    image: traefik/whoami
    command: --port=8080
    expose: ["8080"]

volumes:
  nginx-cert-data:
